# Push a tag like v0.6 (or run "Publish Update.bat") and this builds open-overwatch.zip and attaches it to a
# GitHub release. The lander's download button points at releases/latest/download/open-overwatch.zip, so it
# always serves the newest version.
name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the download zip
        run: |
          D=dist/open-overwatch
          mkdir -p "$D/brand/hero" "$D/brand/social" "$D/brand/textures" "$D/brand/models"
          cp open-overwatch.html globe.html serve.js serve.py README.txt \
             "Start Open Overwatch.bat" "Start Open Overwatch (minimized).vbs" "$D/"
          cp -r brand/emblem brand/sprites "$D/brand/"
          rm -rf "$D/brand/sprites/raw"
          cp brand/hero/*.webp "$D/brand/hero/"
          cp brand/social/og-1200x630.png "$D/brand/social/"
          cp -r brand/textures/night "$D/brand/textures/"
          cp -r brand/models/. "$D/brand/models/"   # satellites, aircraft/ and test/ (3D planes need aircraft/)
          rm -rf "$D/brand/models/previews"
          echo "$GITHUB_REF_NAME" > "$D/VERSION.txt"
          (cd dist && zip -qr open-overwatch.zip open-overwatch)
          ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/open-overwatch.zip
          generate_release_notes: true
