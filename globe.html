<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060a">
<title>Open Overwatch · Orbital</title>
<link rel="icon" href="brand/emblem/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;900&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Widgets/widgets.css">
<style>
/* Open Overwatch · Orbital (prototype): one CesiumJS globe from deep space to street level, floating glass UI. */
:root{
  --bg:#04060a; --glass:rgba(8,12,18,.62); --glass-strong:rgba(8,12,18,.82); --edge:rgba(125,255,166,.16); --edge-dim:rgba(230,237,243,.08);
  --ink:#e6edf3; --dim:#8b9bab; --faint:#55667a; --accent:#7dffa6;
  --civ:#5fd3ff; --mil:#ffb44d; --emg:#ff4d5e; --sat:#d9ccff; --gnss:#ffd45c; --geo:#b48cff; --wx:#62e0c8; --qk:#ff7b4f;
  --display:"Big Shoulders Display","Arial Narrow",sans-serif; --body:"Barlow",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
#globe{position:fixed;inset:0}
.cesium-viewer-bottom{display:none!important} /* credits are re-hosted in #credits */
.glass{background:var(--glass);border:1px solid var(--edge-dim);border-radius:14px;backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}

/* top bar */
#top{position:fixed;top:14px;left:14px;right:14px;display:flex;align-items:center;gap:12px;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px}
.brand img{width:34px;height:34px}
.brand b{font:900 21px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;font:500 10px/1.2 var(--mono);letter-spacing:.16em;color:var(--accent);text-transform:uppercase;margin-top:3px}
.stats{display:flex;gap:2px;padding:6px;margin-left:auto}
.stat{padding:4px 12px;border-radius:9px;text-align:center;min-width:64px}
.stat b{display:block;font:600 17px/1.1 var(--mono)}
.stat span{font:500 9.5px/1 var(--mono);letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.links{display:flex;gap:6px;padding:6px}
.links a,.chipbtn{display:inline-flex;align-items:center;padding:8px 12px;border-radius:9px;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-decoration:none;border:1px solid transparent;background:none}
.links a:hover,.chipbtn:hover{color:var(--ink);border-color:var(--edge-dim)}

/* layer dock */
#dock{position:fixed;left:14px;top:84px;width:250px;padding:12px;z-index:4;max-height:calc(100% - 200px);overflow:auto}
#dock h3{margin:2px 4px 8px;font:700 12px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.ly{display:flex;align-items:center;gap:10px;width:100%;padding:8px 8px;border-radius:9px;border:0;background:none;text-align:left}
.ly:hover{background:rgba(230,237,243,.05)}
.ly i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);flex:0 0 auto;transition:opacity .2s}
.ly .n{margin-left:auto;font:500 11px/1 var(--mono);color:var(--faint)}
.ly .t{font-weight:500}
.ly.off{color:var(--faint)} .ly.off i{opacity:.2;box-shadow:none}
.sep{height:1px;background:var(--edge-dim);margin:8px 4px}
.note{font-size:11.5px;color:var(--faint);margin:8px 6px 2px;line-height:1.35}

/* altitude band + presets */
#band{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;z-index:5}
.alt{padding:4px 14px 4px 10px;border-right:1px solid var(--edge-dim);margin-right:2px;min-width:170px}
.alt b{display:block;font:900 20px/1 var(--display);letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
.alt span{font:500 11px/1.4 var(--mono);color:var(--dim)}
.go{padding:10px 14px;border-radius:9px;border:1px solid transparent;background:none;font:600 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.go:hover{color:var(--ink);border-color:var(--edge-dim);background:rgba(230,237,243,.04)}
.go.on{color:var(--accent);border-color:var(--edge)}

/* detail card */
#card{position:fixed;right:14px;top:84px;width:320px;padding:16px 18px;z-index:4;transform:translateX(120%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#card.show{transform:none}
#card .k{font:500 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--c,var(--accent))}
#card h2{margin:6px 0 10px;font:900 30px/1 var(--display);letter-spacing:.03em;text-transform:uppercase}
#card dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
#card dt{font:500 10.5px/1.6 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
#card dd{margin:0;font:500 13px/1.6 var(--mono);text-align:right}
#card .x{position:absolute;right:10px;top:10px;border:0;background:none;color:var(--faint);font-size:18px;padding:4px 8px}
#card .acts{display:flex;gap:6px;margin-top:12px}

#hover{position:fixed;pointer-events:none;z-index:6;padding:5px 9px;border-radius:7px;font:500 11.5px/1.2 var(--mono);background:var(--glass-strong);border:1px solid var(--edge-dim);display:none;white-space:nowrap}
#credits{position:fixed;right:12px;bottom:10px;max-width:46vw;z-index:3;font:400 10px/1.3 var(--body);color:var(--faint);text-align:right}
#credits a{color:var(--faint)}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);padding:9px 14px;z-index:7;font:500 12px/1.2 var(--mono);opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
#boot{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:opacity .8s}
#boot.out{opacity:0;pointer-events:none}
#boot div{font:500 12px/1.6 var(--mono);color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
@media (max-width:820px){
  #dock{top:auto;bottom:86px;left:10px;right:10px;width:auto;max-height:34vh;display:none} #dock.open{display:block}
  #top{gap:8px;left:10px;right:10px;top:10px} .brand{padding:7px} .brand b,.brand small{display:none} /* emblem only: the bar must fit 360 px */
  .stats{padding:4px} .stats .stat:nth-child(n+4){display:none} .stat{min-width:52px;padding:4px 8px} .stat b{font-size:15px}
  .links{padding:4px} .links a{display:none} /* keep the Layers button: it is the only way to open the dock on a phone */
  .alt b{font-size:16px;white-space:nowrap} .alt span{white-space:nowrap}
  #band{left:10px;right:10px;transform:none;bottom:10px;overflow-x:auto} .alt{min-width:120px}
  #card{left:10px;right:10px;width:auto;top:auto;bottom:86px;transform:translateY(140%)} #card.show{transform:none}
  #credits{display:none}
}
</style>
</head>
<body>
<div id="globe"></div>
<header id="top">
  <div class="brand glass"><img src="brand/emblem/emblem-256.png" alt=""><div><b>Open Overwatch</b><small>Orbital · prototype</small></div></div>
  <div class="stats glass" id="stats">
    <div class="stat"><b id="sAir">—</b><span>air</span></div>
    <div class="stat"><b id="sMil">—</b><span>mil</span></div>
    <div class="stat"><b id="sSat">—</b><span>sat</span></div>
    <div class="stat"><b id="sQk">—</b><span>quakes</span></div>
    <div class="stat"><b id="sUtc">--:--</b><span>utc</span></div>
  </div>
  <div class="links glass"><button class="chipbtn" id="btnDock">Layers</button><a href="open-overwatch.html">Classic map</a></div>
</header>
<aside id="dock" class="glass" aria-label="Layers"></aside>
<nav id="band" class="glass">
  <div class="alt"><b id="bandName">—</b><span id="bandAlt">—</span></div>
  <button class="go" data-go="ground">Street</button>
  <button class="go" data-go="air">Airspace</button>
  <button class="go" data-go="earth">Earth</button>
  <button class="go" data-go="geo">GEO belt</button>
  <button class="go" data-go="moon">Moon</button>
</nav>
<section id="card" class="glass" aria-live="polite"></section>
<div id="hover"></div>
<div id="credits"></div>
<div id="toast" class="glass"></div>
<div id="boot"><div>Initialising orbital view…</div></div>

<script>window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/';</script>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Cesium.js"></script>
<script src="https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt = n => n == null || isNaN(n) ? '—' : Math.round(n).toLocaleString('en-US');
const C = Cesium;
const toast = (msg, ms = 2600) => { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), ms); };
// large caches (TLE groups ~1.3 MB for Starlink, the OpenSky snapshot) go to Cache Storage: localStorage caps at ~5 MB,
// and a failed write would mean re-downloading and getting refused by CelesTrak's once-per-2-hours rule
const bigStore = {
  async get(k) { try { const r = await (await caches.open('oo3d')).match('/__oo3d/' + k); return r ? await r.json() : store.get(k, null); } catch (e) { return store.get(k, null); } },
  async set(k, v) { try { await (await caches.open('oo3d')).put('/__oo3d/' + k, new Response(JSON.stringify(v), { headers: { 'content-type': 'application/json' } })); return true; } catch (e) { return store.set(k, v); } },
};
const store = { get(k, d) { try { const v = localStorage.getItem('oo3d.' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }, set(k, v) { try { localStorage.setItem('oo3d.' + k, JSON.stringify(v)); return true; } catch (e) { return false; } } };

if (location.protocol === 'file:') { // textures, models and the aircraft relay all need the local helper
  document.querySelector('#boot div').innerHTML = 'The 3D globe needs the local helper.<br>Run <b>Start Open Overwatch.bat</b>, then open<br><b style="text-transform:none">http://127.0.0.1:8787/globe.html</b>';
  throw new Error('opened as a file: start the helper and use http://127.0.0.1:8787/globe.html');
}
/* ------------------------------------------------------------------ relay (same helper as the classic map) */
const RELAY = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname) && location.protocol.startsWith('http') ? location.origin + '/proxy?url=' : null;
async function getJSON(url, { relay = false, timeout = 45000 } = {}) {
  if (relay && !RELAY) throw new Error('live aircraft need the download version (its local helper relays them)');
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), timeout);
  try { const r = await fetch(relay ? RELAY + encodeURIComponent(url) : url, { signal: ctl.signal }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
async function getText(url, timeout = 90000) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), timeout);
  try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error('HTTP ' + r.status); return await r.text(); } finally { clearTimeout(t); }
}

/* ------------------------------------------------------------------ viewer */
const viewer = new C.Viewer('globe', {
  baseLayer: false, animation: false, timeline: false, baseLayerPicker: false, geocoder: false, homeButton: false,
  sceneModePicker: false, navigationHelpButton: false, fullscreenButton: false, infoBox: false, selectionIndicator: false,
  shouldAnimate: true, msaaSamples: 1,
  orderIndependentTranslucency: false, // OIT ignores custom blending: the glint/cloud-shadow shell (premultiplied) vanished under it
  contextOptions: { webgl: { powerPreference: 'high-performance' } }, // 4x MSAA blanked the globe and sky in testing; FXAA instead
});
viewer.clock.clockStep = C.ClockStep.SYSTEM_CLOCK;
const scene = viewer.scene, globe = scene.globe, camera = viewer.camera;
$('#credits').appendChild(viewer.cesiumWidget.creditContainer);
scene.backgroundColor = C.Color.fromCssColorString('#04060a');
// stars: NASA SVS Deep Star Maps 2020 (Hipparcos-2, Tycho-2, Gaia DR2) as cube faces in ICRF axes, Milky Way included
// (brand/tools/make_skybox.py; 1024 px faces on phones)
{ const p = matchMedia('(max-width: 820px)').matches ? 'brand/textures/sky_1k/' : 'brand/textures/sky/';
  scene.skyBox = new C.SkyBox({ sources: { positiveX: p + 'px.jpg', negativeX: p + 'nx.jpg', positiveY: p + 'py.jpg',
    negativeY: p + 'ny.jpg', positiveZ: p + 'pz.jpg', negativeZ: p + 'nz.jpg' } }); }
/* ------------------------------------------------------------------ Earth
   From space: NASA Blue Marble NG (day) and VIIRS Black Marble (night lights, 500 m) streamed from NASA GIBS, real sun
   lighting with Cesium's ground atmosphere, and three shader shells. Two read brand/textures/earth_fx_*.jpg
   (make_earth_fx.py: R clouds, G water, B soft clouds): the surface shell (1.5 km: sun glint, cloud shadows, deep-water blue over
   the close-in map's seafloor) and a lit cloud layer 9 km up
   (fractal detail and relief shading up close, golden at the terminator, dissolving as you zoom in). The limb shell
   (115 km) draws the edge-on atmosphere: blue by day, red-gold bands at sunrise/sunset, green airglow at night.
   Close in, Earth.update() (every frame) fades the realism into a fully lit, readable satellite map: below ~20 km there
   is no day/night, no clouds and no night layer. Shells use compressVertices:false (quantised normals streak the light).
   Lessons: the ground atmosphere replaces the night side with its own (black) colour unless nightFade* puts its "far"
   mix at 1 (both nightFade distances are measured from the Earth's centre, like lightingFade*); a single 8k imagery
   tile broke globe rendering, so imagery stays tiled. */
const R_EQ = 6378137, R_PO = 6356752.3142;
globe.baseColor = C.Color.fromCssColorString('#0b1622');
globe.enableLighting = true;
globe.dynamicAtmosphereLighting = true;
globe.dynamicAtmosphereLightingFromSun = true;
globe.showGroundAtmosphere = true;
globe.lightingFadeOutDistance = R_EQ + 2.0e4; // fully lit, no night, below ~20 km
globe.lightingFadeInDistance = R_EQ + 2.0e5;  // real day/night above ~200 km
globe.nightFadeOutDistance = 1.0;             // => the night side keeps its surface (city lights) under the atmosphere
globe.nightFadeInDistance = 0.0;
scene.fog.enabled = true;
scene.skyAtmosphere.perFragmentAtmosphere = true; // smoother limb glow than the per-vertex default
if (!scene.moon) scene.moon = new C.Moon();
scene.moon.show = true; scene.sun.show = true; scene.sun.glowFactor = 1.6; // a brilliant star from orbit, not a dull disc
const ctrl = scene.screenSpaceCameraController;
ctrl.maximumZoomDistance = 6.0e8;       // past the Moon (~384,000 km)
ctrl.minimumZoomDistance = 150;
scene.postProcessStages.fxaa.enabled = true;

const ESRI = 'https://services.arcgisonline.com/ArcGIS/rest/services/';
// NASA layers come from GIBS's geographic (EPSG:4326) set, which runs pole to pole (web-mercator stops at 85.05 deg and
// left holes over the poles). Its 512 px tiles start at 288 deg wide (2x1) and halve from there, so a geographic tiling
// scheme over a 576 x 288 deg rectangle lines up with every level.
const GIBS = 'https://gibs.earthdata.nasa.gov/wmts/epsg4326/best/';
const gibs = (layer, ext) => new C.UrlTemplateImageryProvider({ url: GIBS + layer + '/default/default/500m/{z}/{y}/{x}.' + ext,
  tilingScheme: new C.GeographicTilingScheme({ rectangle: C.Rectangle.fromDegrees(-180, -198, 396, 90), numberOfLevelZeroTilesX: 2, numberOfLevelZeroTilesY: 1 }),
  rectangle: C.Rectangle.fromDegrees(-180, -90, 180, 90), tileWidth: 512, tileHeight: 512, maximumLevel: 7, credit: nasaCredit });
const esriCredit = new C.Credit('Imagery © Esri, Maxar, Earthstar Geographics · Esri, HERE, Garmin, © OpenStreetMap contributors');
const nasaCredit = new C.Credit('Blue Marble Next Generation & VIIRS Black Marble: NASA Earth Observatory, via NASA GIBS');
viewer.creditDisplay.addStaticCredit(new C.Credit('Stars: NASA/Goddard Space Flight Center Scientific Visualization Studio; Gaia DR2: ESA/Gaia/DPAC'));
const BASES = {
  imagery: { name: 'Satellite imagery', url: ESRI + 'World_Imagery/MapServer/tile/{z}/{y}/{x}', max: 19, look: { brightness: 0.9, saturation: 0.85, contrast: 1.05 }, labels: ESRI + 'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}' },
  dark: { name: 'Dark map', url: ESRI + 'Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', max: 16, look: { brightness: 1.1, saturation: 1, contrast: 1 }, labels: ESRI + 'Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}' },
};
let baseLayer = null, labelLayer = null, baseId = 'imagery';
// NASA day (far) and night layers: created once, kept between the base map and the labels
const marbleLayer = viewer.imageryLayers.addImageryProvider(gibs('BlueMarble_NextGeneration', 'jpeg'));
Object.assign(marbleLayer, { saturation: 1.2, contrast: 1.1, brightness: 1.12, gamma: 1.06 }); // without HDR (which washes the night side purple) the day needs a little lift
const nightLayer = viewer.imageryLayers.addImageryProvider(gibs('VIIRS_Black_Marble', 'png'));
nightLayer.dayAlpha = 0.0; nightLayer.nightAlpha = 1.0;
// gamma is applied before brightness: x^2.5 pushes Black Marble's dim blue land to near-black, then x3.4 restores the cities
// (the lit-globe shader keeps ~30% on the night side)
Object.assign(nightLayer, { gamma: 0.4, brightness: 3.4, contrast: 1.0 });
function setBase(id) {
  const b = BASES[id] || BASES.imagery; store.set('base', id); baseId = BASES[id] ? id : 'imagery';
  if (baseLayer) viewer.imageryLayers.remove(baseLayer, true);
  if (labelLayer) viewer.imageryLayers.remove(labelLayer, true);
  baseLayer = viewer.imageryLayers.addImageryProvider(new C.UrlTemplateImageryProvider({ url: b.url, maximumLevel: b.max, credit: esriCredit }), 0);
  Object.assign(baseLayer, b.look);
  labelLayer = viewer.imageryLayers.addImageryProvider(new C.UrlTemplateImageryProvider({ url: b.labels, maximumLevel: Math.min(b.max, 16) }));
  labelLayer.alpha = 0.7; labelLayer.show = false;
  labelLayer.dayAlpha = 1.0; labelLayer.nightAlpha = 0.3; // names and borders fade on the night side, so the city lights read
  if (window.Earth) Earth.apply();
}
setBase(store.get('base', 'imagery'));

// shader shells (equirectangular earth_fx texture on an ellipsoid; EllipsoidGeometry's st = lon/lat)
const FX_TEX = matchMedia('(max-width: 820px)').matches ? 'brand/textures/earth_fx_4k.jpg' : 'brand/textures/earth_fx_8k.jpg';
const FX_GLSL = `
uniform sampler2D fx; uniform float fade; uniform float ocean; uniform float cshadow;
czm_material czm_getMaterial(czm_materialInput mi) {
  czm_material m = czm_getDefaultMaterial(mi);
  vec4 t = texture(fx, mi.st);
  vec3 N = normalize(mi.normalEC), V = normalize(mi.positionToEyeEC), L = normalize(czm_lightDirectionEC);
  float ndl = dot(N, L), day = smoothstep(-0.02, 0.12, ndl);
  // sun glint on water (sharp core + wider sheen), suppressed under cloud, boosted at grazing angles
  float nh = max(dot(N, normalize(L + V)), 0.0);
  float glint = (pow(nh, 700.0) * 0.75 + pow(nh, 90.0) * 0.32 + pow(nh, 16.0) * 0.07) * t.g * (1.0 - 0.85 * t.r * min(cshadow * 4.0, 1.0)) * day; // no cloud holes in it with the clouds layer off
  glint *= 1.0 + 1.5 * pow(1.0 - max(dot(N, V), 0.0), 5.0);
  // cloud shadow: the soft cloud density sampled toward the sun, for clouds ~9 km up
  vec3 nW = normalize(czm_inverseViewRotation * N), lW = normalize(czm_inverseViewRotation * L);
  vec3 east = normalize(cross(vec3(0.0, 0.0, 1.0), nW)), north = cross(nW, east);
  float cosz = max(dot(lW, nW), 0.12);
  vec2 off = vec2(dot(lW, east), dot(lW, north)) / cosz * 9000.0;
  float coslat = max(sqrt(1.0 - nW.z * nW.z), 0.05);
  float shadow = texture(fx, mi.st + vec2(off.x / (6.2832 * 6378137.0 * coslat), off.y / (3.1416 * 6378137.0))).b * 0.45 * day * cshadow; // follows the cloud layer's own fade
  vec3 sheen = mix(vec3(0.62, 0.74, 0.92), vec3(1.0, 0.95, 0.86), clamp(glint * 1.5, 0.0, 1.0)) * glint; // silvery sheen, warm core
  // open ocean (> ~25 km from any coast) in deep-water blue over the close-in map, whose seafloor relief reads as a chart;
  // shallow coastal water keeps the map's own colours
  vec2 r = vec2(25000.0 / (6.2832 * 6378137.0 * coslat), 25000.0 / (3.1416 * 6378137.0));
  float open = min(min(t.g, min(texture(fx, mi.st + vec2(r.x, 0.0)).g, texture(fx, mi.st - vec2(r.x, 0.0)).g)),
                   min(texture(fx, mi.st + vec2(0.0, r.y)).g, texture(fx, mi.st - vec2(0.0, r.y)).g));
  float sea = smoothstep(0.6, 0.95, open) * ocean;
  vec3 seaCol = vec3(0.035, 0.075, 0.17) * clamp(5.0 * ndl + 0.3, 0.0, 1.0) * clamp(5.0 * ndl, 0.0, 1.0); // GlobeFS diffuse x day blend
  sheen += vec3(0.008, 0.024, 0.05) * t.g * clamp(5.0 * max(ndl, 0.0), 0.0, 1.0); // deep water reads near-black from low orbit without the haze: lift it to blue
  m.diffuse = sheen * fade + seaCol * sea;                    // premultiplied: added on top
  m.alpha = clamp(sea + shadow * (1.0 - sea), 0.0, 1.0);      // the cloud shadow darkens the surface, the sea replaces it
  return m;
}`;
const CLOUD_GLSL = `

/* ------------------------------------------------------------------ 3D satellite models (brand/models, built in Blender)
   Satellites near the camera swap their point for a glTF model at real size, flying nose-first (+X along velocity,
   +Z to zenith), with solar arrays (nodes solar_*) turned toward the real sun about the model's Y axis. Positions of
   modelled satellites are exact SGP4 every frame (the worker's 1 s linear extrapolation drifts ~4 m, visible up close).
   Blender exports Y-up glTF; Cesium converts it back to Z-up, so Blender axes == model axes (forward axis is set by
   MODEL_FIX, measured with brand/models/test/axes.glb). A Blender +Y rotation is a rotation about glTF -Z for node
   transformations, because node transforms are applied in glTF space. */
const SatModels = {
  dir: 'brand/models/', max: 40, range: 4.0e6, pool: new Map(), nodes: {}, followed: null, frame: 0,

  classify(s) {

    if (n === 'CSS (TIANHE)') return 'css';
    if (/^(ISS|CSS) \(/.test(n)) return null;              // other station modules share the station's orbit and position
    if (n === 'HST') return 'hubble';
    if (/SOYUZ|PROGRESS|SHENZHOU|TIANZHOU|DRAGON|CYGNUS|STARLINER|HTV/.test(n)) return 'soyuz';
    if (/STARLINK/.test(n)) return 'starlink';
    if (/\bDEB\b/.test(n)) return null;                  // debris fragments: no model, they stay dots
    if (/ R\/B|R\/B$/.test(n)) return 'rocketbody';
    if (s.layer === 'gnss') return 'gnss';

  },
  async solarNodes(type) { // read node names straight from the GLB's JSON chunk
    if (type in this.nodes) return this.nodes[type]; // null = file missing; don't refetch

      this.nodes[type] = (json.nodes || []).map(n => n.name).filter(n => /^solar_/.test(n || ''));

  sunEcf: new C.Cartesian3(1, 0, 0),
  updateSun(time) {

  },
  state(s, time = viewer.clock.currentTime) { // exact position, attitude and array angle at the clock time (cached per instant)
    const key = time.dayNumber * 86400 + time.secondsOfDay;
    if (s._k === key && s._st) return s._st;

    const X = C.Cartesian3.normalize(C.Cartesian3.subtract(v, C.Cartesian3.multiplyByScalar(Z, C.Cartesian3.dot(v, Z), new C.Cartesian3()), new C.Cartesian3()), new C.Cartesian3());

    const th = Math.atan2(C.Cartesian3.dot(this.sunEcf, X), C.Cartesian3.dot(this.sunEcf, Z));

  async ensure(s) {

    if (!type) return null;

    s.ent = viewer.entities.add({

      orientation: new C.CallbackProperty(t => this.state(s, t).quat, false),
      model: { uri: this.dir + type + '.glb', minimumPixelSize: 34, maximumScale: 4.0e4, nodeTransformations, runAnimations: false,
        customShader: new C.CallbackProperty(t => this.state(s, t).shadow ? SHADOW_FILL : undefined, false) },

  drop(s) {

  refresh() { // which satellites get a model: the nearest within range, plus the selected and followed ones

    // Checked over the whole catalogue (not just near the camera), so Follow/selection can never pick a docked one.
    const pos = s => { const i = s.idx * 6; return [b[i] + b[i + 3] * dt, b[i + 1] + b[i + 4] * dt, b[i + 2] + b[i + 5] * dt]; };

    const want = new Set(near.filter(x => !docked.has(x[1])).slice(0, this.max).map(x => x[1]));
    if (this.followed) want.add(this.followed); if (selected && selected.kind === 'sat' && !selected.docked) want.add(selected);

  get followed() { return Follow.obj && Follow.obj.kind === 'sat' ? Follow.obj : null; },
  async follow(s) {

/* ------------------------------------------------------------------ follow camera (satellites and aircraft)
   Runs before every frame (scene.preUpdate): re-centres the camera on the object's exact position for this frame and
   keeps the user's orbit offset, so you can drag around it and zoom while it moves. (Cesium's trackedEntity lags one
   tick behind its target — ~115 m at orbital speed.) The start glides in from wherever the camera is. */
const Follow = {
  obj: null, getPos: null, ent: null, minPx: 34, glide: null, _T: new C.Matrix4(),
  start(obj, getPos, r, ent, minPx) {

    const T = C.Transforms.eastNorthUpToFixedFrame(p), inv = C.Matrix4.inverseTransformation(T, new C.Matrix4());
    const from = C.Matrix4.multiplyByPoint(inv, camera.positionWC, new C.Cartesian3());
    this.glide = { from, to: new C.Cartesian3(-r, -r, r * 0.55), t0: performance.now(), dur: 2200 };
    Object.assign(this, { obj, getPos, ent, minPx });
    ent.model.minimumPixelSize = 0;   // true size while you're next to it
    ctrl.minimumZoomDistance = 2;
    $('#band').querySelectorAll('.go').forEach(x => x.classList.remove('on'));
    toast(`Following ${obj.name || obj.flight || obj.hex} · drag to orbit it, scroll to zoom, Esc to stop`, 4200);
    if (selected === obj) select(obj);

  stop() {
    const o = this.obj; if (!o) return;

setInterval(() => SatModels.refresh(), 400);

/* ------------------------------------------------------------------ aircraft: OpenSky snapshot + adsb.lol military, dead-reckoned */
const Air = {
  map: new Map(), fetchedAt: {},

      const dt = (a.ts - r.ts) / 1000;

    r.pt.color = col; r.icon.rotation = -C.Math.toRadians(r.track || 0);

    if (r.sprite !== img) { r.sprite = img; r.shape = shape; r.icon.image = img; r.icon.width = r.icon.height = SPRITE_SIZE[shape]; }

  async opensky() {
    let rows = null; const c = await bigStore.get('opensky');
    if (c && Date.now() - c.t < 15 * 60e3) rows = c.rows; // anonymous OpenSky: 400 credits/day, a global snapshot costs 4
    else {

      rows = (d.states || []).filter(s => s[5] != null && s[6] != null).map(s => [s[0], (s[1] || '').trim(), s[2], s[5], s[6], s[8] ? 0 : s[7], s[8] ? 1 : 0, s[9], s[10], s[14], s[11]]);

/* ------------------------------------------------------------------ 3D aircraft (brand/models/aircraft, built in Blender)

   bank from the measured turn rate. Same axes as the satellites (+X nose, +Z up), so the same MODEL_FIX applies. */

  max: 200, range: 3.0e5, ceiling: 6.0e5, pool: new Map(),
  view: { airliner: 38, prop: 28, heli: 18, fighter: 17, heavy: 50, tprop: 40 },
  get followed() { return Follow.obj && Follow.obj.kind === 'air' ? Follow.obj : null; },
  posAt(r, ms) { // geodetic position at time ms: dead reckoning, horizontally up to 15 min (the OpenSky refresh, so planes

  state(r, time = viewer.clock.currentTime) {
    const key = time.dayNumber * 86400 + time.secondsOfDay;
    if (r._k === key && r._st) return r._st;
    const st = r._st || (r._st = { pos: new C.Cartesian3(), quat: new C.Quaternion() });
    r._k = key;

  ensure(r) {
    if (r.ent) return r.ent;
    const rotor = new C.NodeTransformationProperty({ rotation: new C.CallbackProperty(t => C.Quaternion.fromAxisAngle(C.Cartesian3.UNIT_Y, (t.secondsOfDay * 2 * Math.PI * 4.5) % (2 * Math.PI)), false) });
    r.ent = viewer.entities.add({
      position: new C.CallbackProperty(t => this.state(r, t).pos, false),
      orientation: new C.CallbackProperty(t => this.state(r, t).quat, false),
      model: { uri: this.uri(r), minimumPixelSize: 26, maximumScale: 2.0e4, nodeTransformations: { rotor }, silhouetteColor: C.Color.fromCssColorString('#ff4d5e'), silhouetteSize: r.emerg ? 2.0 : 0.0 },
    });
    r.ent.air = r; r.pt.show = false; r.icon.show = false; this.pool.set(r.hex, r);
    return r.ent;
  },
  drop(r, force = false) {
    if (!r.ent || (!force && (r === Follow.obj || r === selected))) return;
    if (r === Follow.obj) Follow.stop();
    viewer.entities.remove(r.ent); r.ent = null; this.pool.delete(r.hex);
    const on = L[r.mil ? 'mil' : 'air'].on; r.pt.show = on; r.icon.show = on;
  },
  refresh() {
    const want = new Set();
    if (camHeight() < this.ceiling) {
      const cam = camera.positionWC, near = [];
      for (const r of Air.map.values()) {
        if (!L[r.mil ? 'mil' : 'air'].on || !r.cur) continue;
        const p = C.Cartesian3.fromDegrees(r.cur.lon, r.cur.lat, r.alt || 0, C.Ellipsoid.WGS84, this._p || (this._p = new C.Cartesian3()));
        const d = C.Cartesian3.distance(p, cam); if (d < this.range) near.push([d, r]);
      }
      near.sort((a, b) => a[0] - b[0]);
      for (const [, r] of near.slice(0, this.max)) want.add(r);
    }
    if (this.followed) want.add(this.followed); if (selected && selected.kind === 'air') want.add(selected);
    for (const r of [...this.pool.values()]) if (!want.has(r)) this.drop(r);
    for (const r of want) if (!r.ent && Air.map.has(r.hex)) this.ensure(r);
  },
  follow(r) { const ent = this.ensure(r); Follow.start(r, t => this.state(r, t).pos, this.view[r.shape] || 38, ent, 26); },
};
setInterval(() => AirModels.refresh(), 500);

function every(ms, fn, label) { const run = () => fn().catch(e => { console.warn(label, e); toast(`${label}: ${e.message}`); }); run(); return setInterval(run, ms); }

/* ------------------------------------------------------------------ earthquakes (USGS, CORS-enabled) */
const Quakes = {
  list: [],
  async load() {
    const d = await getJSON('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson');
    qkPts.removeAll(); this.list = [];
    for (const f of d.features || []) {
      const [lon, lat, depth] = f.geometry.coordinates, m = f.properties.mag || 0;
      const q = { kind: 'quake', mag: m, place: f.properties.place, time: f.properties.time, depth, lat, lon, url: f.properties.url };
      q.pt = qkPts.add({ position: C.Cartesian3.fromDegrees(lon, lat, 0), pixelSize: 4 + m * 2.2, color: C.Color.fromCssColorString('#ff7b4f').withAlpha(0.75), outlineColor: C.Color.fromCssColorString('#ff7b4f'), outlineWidth: 1, id: q, show: L.quakes.on, disableDepthTestDistance: 0 });
      this.list.push(q);
    }
    setCount('quakes', this.list.length); updateStats();
  },
};

/* ------------------------------------------------------------------ stats, altitude band, presets */
function updateStats() {
  let air = 0, mil = 0; for (const r of Air.map.values()) r.mil ? mil++ : air++;
  $('#sAir').textContent = fmt(air); $('#sMil').textContent = fmt(mil);
  $('#sSat').textContent = fmt(Sats.list.filter(s => L[s.layer].on).length); $('#sQk').textContent = fmt(Quakes.list.length);
}
setInterval(() => { $('#sUtc').textContent = new Date().toISOString().slice(11, 16); }, 1000);
const BANDS = [[1.0e8, 'Cislunar'], [3.0e7, 'Deep space'], [8.0e6, 'High orbit'], [1.2e6, 'Low orbit'], [1.5e5, 'Airspace'], [8.0e3, 'Region'], [-Infinity, 'Street']];
function camHeight() { const c = camera.positionCartographic; return c ? c.height : C.Cartesian3.magnitude(camera.positionWC) - 6371000; } // ellipsoid height (a sphere radius goes negative near the poles)
function updateBand() {
  const h = camHeight(), name = (BANDS.find(([min]) => h >= min) || BANDS[BANDS.length - 1])[1];
  $('#bandName').textContent = name;
  $('#bandAlt').textContent = h > 1e6 ? fmt(h / 1000) + ' km above Earth' : h > 1e4 ? fmt(h / 1000) + ' km' : fmt(h) + ' m';
  if (labelLayer) labelLayer.show = L.labels.on && h < 3.0e6;
  airIcons.show = h > 6.0e4; // from low down, flat top-down icons near the horizon look like upright cards; the 3D pool covers the view
}
camera.percentageChanged = 0.02; camera.changed.addEventListener(updateBand);
setInterval(updateBand, 250); // also catches lookAt/follow moves, which don't always raise camera.changed (the city-lights layer must be off below 300 km)

let lookingAtMoon = false;
function moonPosition(time = viewer.clock.currentTime) {
  const inertial = C.Simon1994PlanetaryPositions.computeMoonPositionInEarthInertialFrame(time);
  const m = C.Transforms.computeIcrfToFixedMatrix(time) || C.Transforms.computeTemeToPseudoFixedMatrix(time);
  return C.Matrix3.multiplyByVector(m, inertial, new C.Cartesian3());
}
function release() { if (Follow.obj) Follow.stop(); if (lookingAtMoon) { camera.lookAtTransform(C.Matrix4.IDENTITY); lookingAtMoon = false; } }
const PRESETS = {
  ground: () => flyDeg(-0.1278, 51.495, 3500, -45),
  air: () => flyDeg(2.5, 46, 1.4e6, -70),
  earth: () => { const [lon, lat] = sunlitView(); flyDeg(lon, lat, 2.0e7, -90); },
  geo: () => flyDeg(-40, 0, 1.6e8, -90),
  moon: () => {
    const mp = moonPosition();
    camera.flyToBoundingSphere(new C.BoundingSphere(mp, 1737400), { offset: new C.HeadingPitchRange(0, -0.15, 9.0e6), duration: 4.5,
      complete: () => { camera.lookAt(moonPosition(), new C.HeadingPitchRange(camera.heading, camera.pitch, C.Cartesian3.distance(camera.positionWC, moonPosition()))); lookingAtMoon = true; } });
  },
};
function flyDeg(lon, lat, h, pitchDeg) { release(); camera.flyTo({ destination: C.Cartesian3.fromDegrees(lon, lat, h), orientation: { heading: 0, pitch: C.Math.toRadians(pitchDeg), roll: 0 }, duration: 3 }); }
$('#band').addEventListener('click', e => { const b = e.target.closest('[data-go]'); if (!b) return; document.querySelectorAll('.go').forEach(x => x.classList.toggle('on', x === b)); PRESETS[b.dataset.go](); });

/* ------------------------------------------------------------------ picking: hover tip + detail card */
const handler = new C.ScreenSpaceEventHandler(scene.canvas);
function pickObj(pos) { const p = scene.pick(pos), id = p && p.id; return id ? (id.kind ? id : id.sat || id.air || null) : null; } // points carry the object; model entities carry .sat / .air
function tipFor(o) {
  if (o.kind === 'sat') return `${o.name} · ${L[o.layer].name.split(' (')[0]}`;
  if (o.kind === 'air') return `${o.flight || o.hex} · ${o.ground ? 'on ground' : fmt((o.alt || 0) / 0.3048) + ' ft'}${o.mil ? ' · military' : ''}`;
  if (o.kind === 'quake') return `M${o.mag.toFixed(1)} · ${o.place}`;
  return '';
}
let hoverRaf = 0;
handler.setInputAction(m => {
  if (hoverRaf) return; hoverRaf = requestAnimationFrame(() => {
    hoverRaf = 0; const o = pickObj(m.endPosition), t = $('#hover');
    if (!o) { t.style.display = 'none'; scene.canvas.style.cursor = ''; return; }
    t.textContent = tipFor(o); t.style.display = 'block'; t.style.left = (m.endPosition.x + 14) + 'px'; t.style.top = (m.endPosition.y + 12) + 'px'; scene.canvas.style.cursor = 'pointer';
  });
}, C.ScreenSpaceEventType.MOUSE_MOVE);
handler.setInputAction(c => { const o = pickObj(c.position); if (o) select(o); else closeCard(); }, C.ScreenSpaceEventType.LEFT_CLICK);

let selected = null;
function row(k, v) { return `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`; }
function select(o) {
  selected = o; orbitLines.removeAll(); const card = $('#card'); let html = '';
  if (o.kind === 'sat') {
    const i = Sats.info(o), l = L[o.layer];
    html = `<div class="k" style="--c:${l.color}">${esc(l.name)}</div><h2>${esc(o.name)}</h2><dl>${row('NORAD', o.id)}${row('Altitude', fmt(i.alt) + ' km')}${row('Speed', fmt(i.speed) + ' km/h')}${row('Orbit period', i.period.toFixed(1) + ' min')}${row('Inclination', i.incl.toFixed(1) + '°')}${row('Over', i.lat.toFixed(2) + ', ' + i.lon.toFixed(2))}</dl>`;
    Sats.orbit(o);
  } else if (o.kind === 'air') {
    html = `<div class="k" style="--c:${o.mil ? '#ffb44d' : '#5fd3ff'}">${o.mil ? 'Military aircraft' : 'Aircraft'} · ${esc(o.src)}</div><h2>${esc(o.flight || o.hex)}</h2><dl>${row('ICAO hex', o.hex)}${o.type ? row('Type', o.type) : ''}${o.reg ? row('Registration', o.reg) : ''}${o.country ? row('Country', o.country) : ''}${row('Altitude', o.ground ? 'on ground' : fmt((o.alt || 0) / 0.3048) + ' ft')}${row('Speed', o.gs != null ? fmt(o.gs / 0.514444) + ' kt' : '—')}${row('Track', o.track != null ? Math.round(o.track) + '°' : '—')}${row('Squawk', o.squawk || '—')}${row('Last fix', Math.round((Date.now() - o.ts) / 1000) + ' s ago')}</dl>`;
  } else if (o.kind === 'quake') {
    const link = /^https:\/\//.test(o.url) ? `<div class="acts"><a class="chipbtn" href="${esc(o.url)}" target="_blank" rel="noopener">USGS page</a></div>` : '';
    html = `<div class="k" style="--c:#ff7b4f">Earthquake</div><h2>M${o.mag.toFixed(1)}</h2><dl>${row('Where', o.place)}${row('When', new Date(o.time).toISOString().slice(0, 16).replace('T', ' ') + ' UTC')}${row('Depth', fmt(o.depth) + ' km')}</dl>${link}`;
  }
  const following = Follow.obj === o;
  const followBtn = (o.kind === 'sat' && SatModels.classify(o)) || o.kind === 'air' ? `<button class="chipbtn" id="btnFollow">${following ? 'Stop following' : 'Follow in 3D'}</button>` : '';
  card.innerHTML = `<button class="x" aria-label="Close">×</button>${html}<div class="acts">${following ? '' : '<button class="chipbtn" id="btnFocus">Fly to</button>'}${followBtn}</div>`;
  card.classList.add('show');
  card.querySelector('.x').onclick = closeCard;
  if ($('#btnFocus')) $('#btnFocus').onclick = () => focusOn(o);
  if ($('#btnFollow')) $('#btnFollow').onclick = () => following ? Follow.stop() : o.kind === 'air' ? AirModels.follow(o) : SatModels.follow(o);
}
function closeCard() { selected = null; orbitLines.removeAll(); $('#card').classList.remove('show'); }
function focusOn(o) {
  release();
  if (o.kind === 'sat') { const p = o.pt.position, h = C.Cartesian3.magnitude(p) - 6371000; camera.flyToBoundingSphere(new C.BoundingSphere(p, 1), { offset: new C.HeadingPitchRange(0, -0.6, Math.max(2.5e6, h * 0.6)), duration: 2.5 }); }
  else if (o.kind === 'air') flyDeg(o.cur?.lon ?? o.lon, (o.cur?.lat ?? o.lat) - 0.35, 45000, -50);
  else flyDeg(o.lon, o.lat - 1.2, 3.5e5, -60);
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (Follow.obj) Follow.stop(); else closeCard(); } });
// double-click a satellite to follow it (replaces Cesium's default entity-tracking double-click)
viewer.screenSpaceEventHandler.removeInputAction(C.ScreenSpaceEventType.LEFT_DOUBLE_CLICK);
handler.setInputAction(c => { const o = pickObj(c.position); if (o && o.kind === 'sat') { select(o); SatModels.follow(o); } else if (o && o.kind === 'air') { select(o); AirModels.follow(o); } }, C.ScreenSpaceEventType.LEFT_DOUBLE_CLICK);
// Model lighting. Cesium lights glTF models from the real sun, which leaves aircraft over a night-time map almost black.
// Below 300 km the globe itself is unlit (see updateBand), so swapping the scene light there is safe: use a soft light
// from overhead and slightly behind the viewer. Higher up the scene light must stay the sun (the globe's day/night
// shading uses it); satellites in Earth's shadow get SHADOW_FILL instead, a per-model ambient term.
const Lighting = {
  sun: scene.light, fill: new C.DirectionalLight({ direction: new C.Cartesian3(0, 0, -1), intensity: 2.2 }),
  update() {
    if (camHeight() < 2.2e4) { // only below the globe's own lighting fade (20 km), so it never fights the real day/night
      const up = C.Cartesian3.normalize(camera.positionWC, new C.Cartesian3());
      const dir = C.Cartesian3.add(C.Cartesian3.negate(up, new C.Cartesian3()), C.Cartesian3.multiplyByScalar(camera.directionWC, 0.45, new C.Cartesian3()), new C.Cartesian3());
      C.Cartesian3.normalize(dir, this.fill.direction);
      if (scene.light !== this.fill) scene.light = this.fill;
    } else if (scene.light !== this.sun) scene.light = this.sun;
  },
};
scene.preUpdate.addEventListener((sc, time) => { Follow.track(time); Lighting.update(); });

/* ------------------------------------------------------------------ frame loop + boot */
scene.preRender.addEventListener((sc, time) => { SatModels.frame++; SatModels.updateSun(time); Sats.update(Date.now()); Earth.update(camHeight()); });
setInterval(() => { Air.update(Date.now()); }, 250);
setInterval(() => Air.prune(), 30e3);
function bootDone() { $('#boot').classList.add('out'); setTimeout(() => $('#boot').remove(), 900); }
// open on a mostly sunlit Earth whatever the time: day across most of the disk, the terminator and city lights on the left
function sunlitView() { const [lon, lat] = sunSubpoint(); return [((lon - 38 + 540) % 360) - 180, Math.max(-35, Math.min(35, lat + 12))]; }
function sunSubpoint(time = C.JulianDate.now()) {
  const p = C.Simon1994PlanetaryPositions.computeSunPositionInEarthInertialFrame(time);
  const m = C.Transforms.computeIcrfToFixedMatrix(time) || C.Transforms.computeTemeToPseudoFixedMatrix(time);
  const c = C.Cartographic.fromCartesian(C.Cartesian3.multiplyByScalar(C.Cartesian3.normalize(C.Matrix3.multiplyByVector(m, p, new C.Cartesian3()), new C.Cartesian3()), R_EQ, new C.Cartesian3()));
  return [C.Math.toDegrees(c.longitude), C.Math.toDegrees(c.latitude)];
}
{ const [lon, lat] = sunlitView(); camera.setView({ destination: C.Cartesian3.fromDegrees(lon, lat, 2.0e7) }); }
updateBand(); applyVisibility();
{ const t0 = Date.now(); const wait = setInterval(() => { if ((nightLayer && globe.tilesLoaded) || Date.now() - t0 > 8000) { clearInterval(wait); bootDone(); } }, 200); } // hold the boot screen until the globe has something to show
Sats.load().catch(e => toast('Satellites failed: ' + e.message));
every(15 * 60e3, () => Air.opensky(), 'Civil aircraft');
every(60e3, () => Air.military(), 'Military aircraft');
every(10 * 60e3, () => Quakes.load(), 'Earthquakes');
window.OO3D = { viewer, Earth, marbleLayer, nightLayer, fxShell, cloudShell, limbShell, Sats, Air, Quakes, L, PRESETS, moonPosition, SatModels, AirModels, Follow,
  // debug: the axes test model at lon/lat/height, body X = east, Y = north, Z = up, arrays turned by `deg`
  debugAxes(lon, lat, h, deg = 0, uri = 'brand/models/test/axes.glb') {
    const pos = C.Cartesian3.fromDegrees(lon, lat, h), enu = C.Transforms.eastNorthUpToFixedFrame(pos), R = C.Matrix4.getMatrix3(enu, new C.Matrix3());
    const q = C.Quaternion.multiply(C.Quaternion.fromRotationMatrix(R), MODEL_FIX, new C.Quaternion());
    return viewer.entities.add({ position: pos, orientation: q, model: { uri, minimumPixelSize: 0, nodeTransformations: { solar_1: { rotation: C.Quaternion.fromAxisAngle(SOLAR_AXIS, C.Math.toRadians(deg)) } } } });
  } };
</script>
</body>
