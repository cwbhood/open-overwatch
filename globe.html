html,body{touch-action:pan-x pan-y;-webkit-text-size-adjust:100%} /* no page pinch-zoom; panels still scroll */
/* Open Overwatch · Orbital (prototype): one CesiumJS globe from deep space to street level, floating glass UI. */
:root{
  --bg:#04060a; --glass:rgba(8,12,18,.62); --glass-strong:rgba(8,12,18,.82); --edge:rgba(125,255,166,.16); --edge-dim:rgba(230,237,243,.08);
  --ink:#e6edf3; --dim:#8b9bab; --faint:#55667a; --accent:#7dffa6;
  --civ:#5fd3ff; --mil:#ffb44d; --emg:#ff4d5e; --sat:#d9ccff; --gnss:#ffd45c; --geo:#b48cff; --wx:#62e0c8; --qk:#ff7b4f;
  --display:"Big Shoulders Display","Arial Narrow",sans-serif; --body:"Barlow",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
#globe{position:fixed;inset:0}
.cesium-viewer-bottom{display:none!important} /* credits are re-hosted in #credits */
.glass{background:var(--glass);border:1px solid var(--edge-dim);border-radius:14px;backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);box-shadow:0 10px 40px rgba(0,0,0,.35)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}

/* top bar */
#top{position:fixed;top:14px;left:14px;right:14px;display:flex;align-items:center;gap:12px;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
.brand{display:flex;align-items:center;gap:10px;padding:8px 14px 8px 8px}
.brand img{width:34px;height:34px}
.brand b{font:900 21px/1 var(--display);letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;font:500 10px/1.2 var(--mono);letter-spacing:.16em;color:var(--accent);text-transform:uppercase;margin-top:3px}
.stats{display:flex;gap:2px;padding:6px;margin-left:auto}
.timebar{display:flex;align-items:center;gap:3px;padding:6px 8px}
.tnow{padding:0 8px 0 4px;min-width:150px} .tnow b{display:block;font:500 13.5px/1.2 var(--mono)} .tnow span{font:500 9.5px/1 var(--mono);letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.tnow span.off{color:var(--mil)}
.tb{min-width:28px;height:28px;padding:0 7px;border-radius:8px;border:1px solid transparent;background:none;font:500 11.5px/1 var(--mono);color:var(--dim)}
.tb:hover{color:var(--ink);border-color:var(--edge-dim)} .tb.on{color:#04060a;background:var(--accent)}
.stat{padding:4px 12px;border-radius:9px;text-align:center;min-width:64px}
.stat b{display:block;font:600 17px/1.1 var(--mono)}
.stat span{font:500 9.5px/1 var(--mono);letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.links{display:flex;gap:6px;padding:6px}
.links a,.chipbtn{display:inline-flex;align-items:center;padding:8px 12px;border-radius:9px;font:500 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-decoration:none;border:1px solid transparent;background:none}
.links a:hover,.chipbtn:hover{color:var(--ink);border-color:var(--edge-dim)}

/* layer dock */
#dock{position:fixed;left:14px;top:84px;width:250px;padding:12px;z-index:4;max-height:calc(100% - 200px);overflow:auto}
#dock h3{margin:2px 4px 8px;font:700 12px/1 var(--display);letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.ly{display:flex;align-items:center;gap:10px;width:100%;padding:8px 8px;border-radius:9px;border:0;background:none;text-align:left}
.ly:hover{background:rgba(230,237,243,.05)}
.ly i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);flex:0 0 auto;transition:opacity .2s}
.ly .n{margin-left:auto;font:500 11px/1 var(--mono);color:var(--faint)}
.ly .t{font-weight:500}
.ly.off{color:var(--faint)} .ly.off i{opacity:.2;box-shadow:none}
.sep{height:1px;background:var(--edge-dim);margin:8px 4px}
.note{font-size:11.5px;color:var(--faint);margin:8px 6px 2px;line-height:1.35}

/* altitude band + presets */
#band{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:6px;z-index:5}
.alt{padding:4px 14px 4px 10px;border-right:1px solid var(--edge-dim);margin-right:2px;min-width:170px}
.alt b{display:block;font:900 20px/1 var(--display);letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
.alt span{font:500 11px/1.4 var(--mono);color:var(--dim)}
.go{padding:10px 14px;border-radius:9px;border:1px solid transparent;background:none;font:600 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.go:hover{color:var(--ink);border-color:var(--edge-dim);background:rgba(230,237,243,.04)}
.go.on{color:var(--accent);border-color:var(--edge)}

/* detail card */
#card{position:fixed;right:14px;top:84px;width:320px;padding:16px 18px;z-index:4;transform:translateX(120%);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
#card.show{transform:none}
#card .k{font:500 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--c,var(--accent))}
#card h2{margin:6px 0 10px;font:900 30px/1 var(--display);letter-spacing:.03em;text-transform:uppercase}
#card dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
#card dt{font:500 10.5px/1.6 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
#card dd{margin:0;font:500 13px/1.6 var(--mono);text-align:right}
.cjl{display:flex;flex-direction:column;gap:4px;max-height:52vh;overflow:auto;margin-top:8px}
.cj{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;text-align:left;padding:8px 10px;border-radius:9px;border:1px solid var(--edge-dim);background:rgba(230,237,243,.03);color:var(--ink)}
.cj:hover{border-color:#ff6b6b} .cj b{grid-row:span 2;font:700 15px/1.2 var(--mono);color:#ff6b6b;min-width:64px} .cj span{font:500 12px/1.3 var(--sans,system-ui)} .cj small{font:500 10.5px/1.3 var(--mono);color:var(--faint)} .cj.dim{opacity:.45}
#nerd{position:fixed;right:14px;top:84px;width:370px;max-height:calc(100% - 190px);overflow:auto;padding:14px 16px;z-index:6;font:500 12px/1.5 var(--mono);background:rgba(5,8,12,.94)}
#nerd .k{font:600 10px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#ffd27a} #nerd h3{margin:12px 0 4px;font:700 13px/1 var(--display);letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
#nerd dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:0} #nerd dt{color:var(--faint)} #nerd dd{margin:0;text-align:right}
#nerd table{width:100%;border-collapse:collapse;margin-top:4px} #nerd td,#nerd th{padding:1px 4px;text-align:right} #nerd td:first-child,#nerd th:first-child{text-align:left} #nerd th{color:var(--faint);font-weight:500}
#nerd .x{position:absolute;right:8px;top:8px;border:0;background:none;color:var(--faint);font-size:18px;padding:6px 10px}
@media (max-width:820px){ #nerd{left:10px;right:10px;width:auto;top:auto;bottom:100px;max-height:60vh} }
#lookup{display:none} #lookup.on{display:block}
#lookup .lu-top{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;right:10px;display:flex;gap:12px;align-items:center;padding:8px 10px 8px 14px;z-index:8}
#lookup .lu-top b{font:900 18px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:#7dffa6}
#lookup .lu-top span{flex:1;font:500 11px/1.3 var(--mono);color:var(--dim);overflow:hidden;text-overflow:ellipsis}
#lookup .lu-bottom{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:620px;margin:0 auto;padding:10px 14px;z-index:8;font:500 12.5px/1.5 var(--mono)}
#lookup .lu-info{color:#e6edf3;font:500 13px/1.45 var(--body);margin:2px 0 4px} #lookup .lu-info:empty{display:none}
#lookup .lu-when{display:flex;gap:8px;align-items:center;margin:4px 0 2px;color:var(--dim)} #lookup .lu-when input{flex:1;min-width:0;padding:6px 8px;border-radius:8px;border:1px solid var(--edge-dim);background:rgba(5,8,12,.6);color:var(--ink);font:500 12.5px/1 var(--mono);color-scheme:dark} #lookup .lu-when .chipbtn{padding:6px 10px} html.redlight{filter:grayscale(1) sepia(1) saturate(8) hue-rotate(-50deg) brightness(.55)} #lookup #luRed.on{color:#ff6b6b;border-color:rgba(255,107,107,.4)}
#lookup #luCon.on{color:#8fa6c4;border-color:rgba(143,166,196,.4)}
#lookup #luDir{font:700 16px/1.3 var(--display);letter-spacing:.06em;text-transform:uppercase;color:var(--ink)} #lookup .ok{color:#7dffa6}
.lu-cross{position:fixed;left:50%;top:50%;width:28px;height:28px;margin:-14px 0 0 -14px;border:1.5px solid rgba(125,255,166,.55);border-radius:50%;z-index:7;pointer-events:none}
/* keyboard users see where they are */
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #7dffa6;outline-offset:2px}
/* embed mode (#embed=1, an iframe on someone else's page): just the globe, the card, the credits and a way out */
body.embed #top,body.embed #band,body.embed #dock,body.embed #navpad,body.embed .m-dock,body.embed .m-sheet,body.embed .m-scrim,body.embed #wx{display:none!important}
#embedOut{display:none} body.embed #embedOut{display:block;position:fixed;right:10px;top:10px;z-index:9;padding:8px 12px;font:600 11px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:#7dffa6;text-decoration:none}
body.lookup #top,body.lookup #band,body.lookup #dock,body.lookup #card,body.lookup #hover,body.lookup #credits{display:none!important}
#card .x{position:absolute;right:10px;top:10px;border:0;background:none;color:var(--faint);font-size:18px;padding:4px 8px}
#card .acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
#card h3{margin:14px 0 6px;font:700 11px/1.2 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--dim)} #card h3 small{letter-spacing:0;text-transform:none;color:var(--faint)}
.tn-head{margin:4px 0 2px;font:500 14px/1.45 var(--body)} .tn-head b,.tn-p .ok,.tn-head .ok{color:#7dffa6} .tn-p{margin:0;font:500 12.5px/1.45 var(--body)} .tn-p small{color:var(--faint)}
.tn-list{display:flex;flex-direction:column;gap:4px;max-height:34vh;overflow:auto} .tn-row{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;justify-content:space-between;padding:7px 9px;border-radius:9px;border:1px solid var(--edge-dim);background:rgba(230,237,243,.03);font:500 12.5px/1.4 var(--body)}
.tn-row.dim{opacity:.5} .tn-row .ok{color:#7dffa6;font-weight:600} .tn-row .cl,.tn-head .cl{color:#ffb44d;font-weight:600} .tn-b{display:flex;gap:4px} .tn-b .chipbtn{padding:6px 9px;color:#7dffa6} .note.warn{color:#ffb44d}
.lc-cd{margin:2px 0 8px;font:700 26px/1.1 var(--mono);color:#ff9f5c;letter-spacing:.02em}
.fl-form{display:flex;gap:6px;margin:6px 0} .fl-form input{flex:1;min-width:0;padding:9px 11px;border-radius:9px;border:1px solid var(--edge-dim);background:rgba(5,8,12,.6);color:var(--ink);font:600 15px/1 var(--mono);text-transform:uppercase}

#hover{position:fixed;pointer-events:none;z-index:6;padding:5px 9px;border-radius:7px;font:500 11.5px/1.2 var(--mono);background:var(--glass-strong);border:1px solid var(--edge-dim);display:none;white-space:nowrap}
#credits{position:fixed;right:12px;bottom:10px;max-width:46vw;z-index:3;font:400 10px/1.3 var(--body);color:var(--faint);text-align:right}
#credits a{color:var(--faint)}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);padding:9px 14px;z-index:7;font:500 12px/1.2 var(--mono);opacity:0;transition:opacity .3s;pointer-events:none}
#toast.show{opacity:1}
#boot{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:var(--bg);transition:opacity .8s}
#boot.out{opacity:0;pointer-events:none}
#boot div{font:500 12px/1.6 var(--mono);color:var(--dim);letter-spacing:.14em;text-transform:uppercase}
@media (max-width:820px){
  #dock{top:auto;bottom:86px;left:10px;right:10px;width:auto;max-height:34vh;display:none} #dock.open{display:block}
  #top{gap:8px;left:10px;right:10px;top:10px} .brand{padding:7px} .brand b,.brand small{display:none} /* emblem only: the bar must fit 360 px */
  .timebar [data-rate="-3600"],.timebar [data-rate="600"],.timebar #tLive{display:none} .tnow{min-width:0} .tnow b{font-size:11.5px} .tnow span{display:none}
  .stats{padding:4px} .stats .stat:nth-child(n+3){display:none} .stat{min-width:52px;padding:4px 8px} .stat b{font-size:15px}
  .links{padding:4px} .links a{display:none} /* keep the Layers button: it is the only way to open the dock on a phone */
  .alt b{font-size:16px;white-space:nowrap} .alt span{white-space:nowrap}
  #band{left:10px;right:10px;transform:none;bottom:10px;overflow-x:auto} .alt{min-width:120px}
  #card{left:10px;right:10px;width:auto;top:auto;bottom:100px;transform:translateY(160%);max-height:calc(100dvh - 190px);overflow:auto;overscroll-behavior:contain} #card.show{transform:none}
  #card h2{font-size:24px} .cjl{max-height:none}
  #credits{left:12px;right:12px;bottom:86px;max-width:none;text-align:left;font-size:8.5px;opacity:.75;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #toast{top:auto;bottom:104px;max-width:calc(100vw - 24px);white-space:normal;text-align:center}
  .tnow b{white-space:nowrap}
}
@media (max-width:480px){ .stats{display:none} .timebar{padding:4px 5px;gap:1px} .tb{min-width:26px;padding:0 5px} .timebar [data-rate="60"]{display:none} } /* the Layers button must stay on screen */
/* fingers: tap targets of ~40 px (Apple and Google ask for 44/48; the header has to fit 360 px) */
@media (pointer:coarse){
  .tb{min-width:38px;height:38px} .chipbtn,.links a{min-height:40px} .go{min-height:44px;padding:10px 12px}
  #card .x{font-size:24px;padding:8px 14px} .ly{min-height:40px} .cj{min-height:48px}
}
/* phone control set (src/globe/mobile.js adds body.m and the dock only on phones; desktops never match any of this) */
body.m #band,body.m .links,body.m #timebar .tb{display:none}
body.m #timebar{padding:6px 10px} body.m .tnow{cursor:pointer}
.m-dock,.m-sheet,.m-scrim{display:none}
body.m .m-dock{display:flex;position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:6;padding:4px;gap:2px}
.m-tab{flex:1;min-width:0;min-height:54px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:1px solid transparent;border-radius:10px;background:none;color:var(--dim);font:600 10px/1 var(--display);letter-spacing:.12em;text-transform:uppercase;-webkit-tap-highlight-color:transparent}
.m-tab i{font:normal 19px/1 var(--body);font-style:normal} .m-tab.on{color:var(--accent);border-color:var(--edge);background:rgba(125,255,166,.06)}
body.m .m-scrim{display:block;position:fixed;inset:0;z-index:6;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s} body.m .m-scrim.show{opacity:1;pointer-events:auto}
body.m .m-sheet{display:block;position:fixed;left:10px;right:10px;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:7;max-height:calc(100dvh - 170px);overflow:auto;overscroll-behavior:contain;padding:12px;transform:translateY(130%);opacity:0;pointer-events:none;transition:transform .25s ease,opacity .2s}
body.m .m-sheet.show{transform:none;opacity:1;pointer-events:auto}
.m-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:10px} .m-head b{font:900 17px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink)} .m-head span{font:500 11px/1.2 var(--mono);color:var(--dim);text-align:right}
.m-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.m-item{display:block;text-align:left;min-height:56px;padding:9px 11px;border-radius:10px;border:1px solid var(--edge-dim);background:rgba(230,237,243,.03);color:var(--ink);-webkit-tap-highlight-color:transparent}
.m-item b{display:block;font:700 13px/1.2 var(--display);letter-spacing:.1em;text-transform:uppercase} .m-item span{display:block;margin-top:4px;font:400 10.5px/1.3 var(--body);color:var(--dim)}
.m-item.on{border-color:var(--edge);color:var(--accent)} .m-now{margin-top:8px;width:100%}
.m-rates{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.m-rate{min-height:48px;border-radius:10px;border:1px solid var(--edge-dim);background:rgba(230,237,243,.03);color:var(--ink);font:600 12px/1 var(--mono)} .m-rate.on{color:#04060a;background:var(--accent);border-color:var(--accent)}
body.m #dock{bottom:calc(86px + env(safe-area-inset-bottom,0px))} body.m #card{bottom:calc(100px + env(safe-area-inset-bottom,0px))} body.m #credits{bottom:calc(86px + env(safe-area-inset-bottom,0px))} body.m #toast{bottom:calc(104px + env(safe-area-inset-bottom,0px))}
/* country dossier (src/globe/country.js) */
.cn-sec{margin-top:10px;padding-top:8px;border-top:1px solid var(--edge-dim);font:500 12px/1.5 var(--mono);color:var(--dim)} .cn-sec h3{margin:0 0 4px;font:700 11px/1.2 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink)}
.cn-news{display:block;padding:6px 0;border-bottom:1px solid var(--edge-dim);color:var(--ink);text-decoration:none;font:500 12px/1.35 var(--body)} .cn-news:hover span{color:var(--accent)} .cn-news i{display:block;font:500 10px/1.2 var(--mono);font-style:normal;color:var(--faint);margin-top:2px}
#card{max-height:calc(100dvh - 190px);overflow:auto}
/* flybys */
.fb-scale{position:relative;height:30px;margin:14px 4px 6px;border-top:1px solid var(--edge-dim)} .fb-scale i{position:absolute;top:-5px;width:9px;height:9px;margin-left:-4px;border-radius:50%;background:#cdd5e0} .fb-scale b{position:absolute;top:-6px;width:11px;height:11px;margin-left:-5px;border-radius:50%;background:#ffb44d;box-shadow:0 0 10px #ffb44d} .fb-scale span{position:absolute;top:8px;transform:translateX(-50%);font:500 9.5px/1 var(--mono);color:var(--faint)} .fb-scale span:first-of-type{left:0;transform:none}
/* employers in the country dossier */
.cn-co{display:flex;align-items:center;gap:8px;width:100%;padding:5px 2px;border:0;border-bottom:1px solid var(--edge-dim);background:none;color:var(--ink);text-align:left;font:500 12px/1.3 var(--body)} .cn-co:hover span{color:var(--accent)} .cn-co i{width:8px;height:8px;border-radius:50%;flex:none} .cn-co span{flex:1} .cn-co b{font:600 11px/1 var(--mono);color:var(--dim)}
/* guided tour caption */
#tourcap{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);z-index:7;display:flex;flex-direction:column;gap:3px;align-items:center;text-align:center;padding:11px 20px;max-width:min(560px,calc(100vw - 24px));opacity:0;pointer-events:none;transition:opacity .4s,transform .4s}
#tourcap.show{opacity:1;transform:translateX(-50%)} #tourcap b{font:900 20px/1.1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:#ff9f5c} #tourcap span{font:500 12.5px/1.4 var(--body);color:var(--ink)}
body.m #tourcap{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
/* weather mode panel (src/globe/weather.js) */
#wx{position:fixed;left:50%;bottom:96px;transform:translate(-50%,160%);width:min(440px,calc(100vw - 20px));padding:12px 14px;z-index:5;opacity:0;pointer-events:none;transition:transform .3s,opacity .2s}
#wx.show{transform:translateX(-50%);opacity:1;pointer-events:auto}
.wx-head{display:flex;align-items:baseline;gap:10px;margin-bottom:8px} .wx-head b{font:900 16px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;color:#7fd0ff} .wx-head span{flex:1;font:500 11px/1.2 var(--mono);color:var(--dim)} .wx-head .x{border:0;background:none;color:var(--faint);font-size:20px;padding:2px 8px}
.wx-sets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px} .wx-sets .chipbtn{opacity:.55} .wx-sets .chipbtn.on{opacity:1;border-color:#7fd0ff;color:#7fd0ff}
.wx-play{display:flex;align-items:center;gap:10px} .wx-play input{flex:1;accent-color:#7fd0ff;min-height:28px} #wxPlay{min-width:44px}
#wx .note{margin-top:6px}
body.m #wx{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
body.lookup #wx{display:none}
body.lookup .m-dock,body.lookup .m-sheet,body.lookup .m-scrim{display:none!important}
/* desktop navigation pad (src/globe/navpad.js; not built on phones, which have the dock) */
#navpad{position:fixed;right:14px;bottom:48px;z-index:5;display:flex;flex-direction:column;gap:2px;padding:4px}
#navpad button{width:40px;height:40px;border-radius:9px;border:1px solid transparent;background:none;color:var(--ink);font:500 20px/1 var(--body);display:flex;align-items:center;justify-content:center;cursor:pointer}
#navpad button:hover{border-color:var(--edge-dim);background:rgba(230,237,243,.05)} #navpad button:active{background:rgba(125,255,166,.1)}
#navpad svg{width:22px;height:22px;transition:transform .15s} #navpad #npNorth.askew{border-color:var(--edge);box-shadow:0 0 12px rgba(125,255,166,.18)}
body.lookup #navpad{display:none}

<body>
<div id="globe" role="application" aria-label="3D globe. Drag to turn it, scroll to zoom. Press slash to search; the buttons along the bottom fly to places and open lists."></div>
<header id="top">
  <div class="brand glass"><img src="brand/emblem/emblem-256.png" alt=""><div><b>Open Overwatch</b><small>Orbital · prototype</small></div></div>
  <div class="timebar glass" id="timebar">
    <div class="tnow"><b class="mono" id="tNow">—</b><span id="tMode">live</span></div>
    <button class="tb" data-rate="-3600" title="Backwards, 1 hour per second">«</button>
    <button class="tb" data-rate="0" title="Pause">❚❚</button>
    <button class="tb on" data-rate="1" title="Live / real speed">▶</button>
    <button class="tb" data-rate="60" title="1 minute per second">›</button>
    <button class="tb" data-rate="600" title="10 minutes per second">»</button>
    <button class="tb" data-rate="3600" title="1 hour per second">⏩</button>
    <button class="tb" id="tLive" title="Back to now">NOW</button>
  </div>
  <div class="stats glass" id="stats">
    <div class="stat"><b id="sAir">—</b><span>air</span></div>
    <div class="stat"><b id="sMil">—</b><span>mil</span></div>
    <div class="stat"><b id="sSat">—</b><span>sat</span></div>
    <div class="stat"><b id="sQk">—</b><span>quakes</span></div>
  </div>
  <div class="links glass"><button class="chipbtn" id="btnDock">Layers</button><a href="open-overwatch.html">Classic map</a><a href="about.html">About</a></div>
</header>
<aside id="dock" class="glass" aria-label="Layers"></aside>
<nav id="band" class="glass">
  <div class="alt"><b id="bandName">—</b><span id="bandAlt">—</span></div>
  <button class="go" data-go="search" style="color:#7dffa6" title="Search satellites, countries, flights, volcanoes and views  ( / )">⌕ Search</button>
  <button class="go" data-go="ground">Street</button>
  <button class="go" data-go="air">Airspace</button>
  <button class="go" data-go="earth">Earth</button>
  <button class="go" data-go="geo">GEO belt</button>
  <button class="go" data-go="moon">Moon</button>
  <button class="go" data-go="conj" title="Upcoming close approaches between objects in orbit">Near misses</button>
  <button class="go" data-go="tonight" style="color:#7dffa6" title="What you can see in your sky tonight: the space station, Starlink trains, planets, aurora, with reminders">Tonight</button>
  <button class="go" data-go="lookup" style="color:#7dffa6" title="Your sky right now: point your phone up">Look up</button>
  <button class="go" data-go="flight" style="color:#5fd3ff" title="Type a flight number and follow that plane">Find flight</button>
  <button class="go" data-go="tour" style="color:#ff9f5c" title="A guided 80-second flight through what this globe can do">▶ Tour</button>
  <button class="go" data-go="launches" style="color:#ff9f5c" title="Every upcoming rocket launch, with countdowns, webcasts and reminders">Launches</button>
  <button class="go" data-go="flybys" style="color:#ffb44d" title="Asteroids and comets passing Earth in the next 60 days">Flybys</button>
  <button class="go" data-go="weather" style="color:#7fd0ff" title="Live clouds, rain radar and rain from space">Weather</button>
  <button class="go" data-go="eclipses" title="Solar eclipses 2027-2030: watch the Moon's shadow cross the Earth">Eclipses</button>
  <button class="go" data-go="space" style="color:var(--accent)" title="Keep zooming out: the planets, the stars, the galaxy">Solar system ↗</button>
</nav>
<section id="card" class="glass" aria-live="polite" role="region" aria-label="Details"></section>
<div id="lookup" aria-live="polite">
  <div class="lu-top glass"><b>Look up</b><span id="luWhere"></span><button class="chipbtn" id="luExit">Done</button></div>
  <div class="lu-cross"></div>
  <div class="lu-bottom glass"><div id="luDir">—</div><div id="luInfo" class="lu-info" aria-live="polite"></div><div id="luNow"></div><div id="luPass"></div><div class="lu-when"><label for="luDate">Sky on</label><input type="datetime-local" id="luDate" min="1800-01-01T00:00" max="2049-12-31T23:59" aria-label="Show the sky at a date and time"><button class="chipbtn" id="luLive">Now</button><button class="chipbtn" id="luCon" title="Constellation figures and names">Figures</button><button class="chipbtn" id="luRed" title="Red light: keeps your eyes used to the dark for stargazing">Red</button></div><div id="luHint" class="note"></div></div>
</div>
<a id="embedOut" class="glass" href="globe.html" target="_blank" rel="noopener">Open Overwatch ↗</a>
<div id="hover"></div>
<div id="credits"></div>
<div id="toast" class="glass"></div>
<div id="boot"><div>Initialising orbital view…</div></div>

<script>window.CESIUM_BASE_URL = 'https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/';</script>
<script>/* Cesium 1.146 tests `value instanceof OffscreenCanvas` while building materials, which throws where the class does not
   exist (iOS before 16.4, some WebKit builds): the globe never got past its boot screen there. A stand-in that hands out
   an ordinary canvas keeps those checks false and any construction working. */
if (typeof OffscreenCanvas === 'undefined') window.OffscreenCanvas = class OffscreenCanvas { constructor(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; } };</script>
<script src="https://cdn.jsdelivr.net/npm/cesium@1.146.0/Build/Cesium/Cesium.js"></script>
<script src="https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js"></script>
<script>
// ES modules don't load from file://, so say what to do instead of showing a blank page
if (location.protocol === 'file:') document.querySelector('#boot div').innerHTML = 'The 3D globe needs the local helper.<br>Run <b>Start Open Overwatch.bat</b>, then open<br><b style="text-transform:none">http://127.0.0.1:8787/globe.html</b>';
</script>
<script type="module" src="src/globe/main.js"></script>
</body>
